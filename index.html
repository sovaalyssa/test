<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2eee5"><title>Какая ты сегодня Анечка Аббасова?</title><meta name="description" content="Восемь вопросов. Три прекрасных состояния. Маленький тест для Анечки — проект 113."><style>
:root{--paper:#f2eee5;--ink:#252620;--muted:#74756c;--line:#d3d1c7;--pink:#eab2bd;--lime:#dbe18a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #8f3a59;outline-offset:5px}button:disabled{cursor:default;opacity:.35}header{max-width:1280px;margin:auto;padding:28px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:2px;text-transform:uppercase}.brand{display:flex;align-items:center;gap:12px}.brand strong{font:italic 33px Georgia,serif;letter-spacing:-3px}.issue{color:var(--muted);text-align:right;font-size:10px;line-height:1.7}main{max-width:1150px;margin:auto;padding:48px 6% 34px;min-height:calc(100svh - 150px)}footer{max-width:1150px;margin:auto;padding:20px 6% 26px;display:flex;justify-content:space-between;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;line-height:1.6}.hero{display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:45px;min-height:560px}.hero h1{font:normal clamp(48px,6.5vw,85px)/.99 Georgia,serif;letter-spacing:-3px;margin:28px 0}.hero h1 em{font-weight:normal}.intro{font-size:15px;line-height:1.7;max-width:390px;color:#62645a}.primary{display:inline-flex;align-items:center;justify-content:space-between;gap:35px;padding:20px 25px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;min-height:60px;font-size:14px;transition:transform .2s,background .2s}.primary:not(:disabled):hover{background:#45473b;transform:translateY(-2px)}.primary span{font-size:22px}.start{margin-top:22px;min-width:230px}.meta{font-size:11px;color:var(--muted);margin-top:17px}.art{position:relative;min-height:420px}.card{position:absolute;width:240px;height:315px;background:#e9acbb;border:1px solid rgba(0,0,0,.1);padding:22px;box-shadow:0 15px 35px #24252014;display:flex;flex-direction:column;justify-content:space-between;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg)}.card.back{background:var(--lime);transform:translate(-40%,-55%) rotate(9deg)}.card.front{transform:translate(-60%,-40%) rotate(-9deg)}.card small{font-size:9px;letter-spacing:2px;text-transform:uppercase}.card b{font:italic 33px Georgia,serif;font-weight:normal}.symbol{height:160px;width:160px;align-self:center}.art-note{position:absolute;bottom:0;right:0;font:italic 15px Georgia;transform:rotate(-8deg)}.dot{display:inline-block;width:6px;height:6px;background:var(--ink);border-radius:50%;margin-right:6px}.quiz{max-width:730px;margin:12px auto 36px}.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.backbtn{border:0;background:none;padding:10px 0;font-size:13px;color:var(--muted)}.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.bars i{height:3px;background:var(--line)}.bars i.filled{background:var(--ink)}.question-num{font:italic 16px Georgia;color:var(--muted);margin:38px 0 16px}.quiz h2{font:normal clamp(29px,4vw,44px)/1.16 Georgia;letter-spacing:-.7px;margin:0 0 28px}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:17px;text-align:left;border:1px solid var(--line);background:#f8f5ee;border-radius:4px;padding:19px 20px;font-size:15px;line-height:1.45;transition:background .15s,border-color .15s}.answer:hover{border-color:#85877b}.letter{flex:none;display:grid;place-items:center;width:31px;height:31px;border:1px solid #b8b9ac;border-radius:50%;font-size:11px}.answer[aria-checked=true]{background:var(--lime);border-color:var(--ink)}.answer[aria-checked=true] .letter{background:var(--ink);color:var(--paper);border-color:var(--ink)}.question-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:25px}.hint{font:italic 14px/1.4 Georgia;color:var(--muted);max-width:200px}.result{max-width:740px;margin:10px auto 25px}.result-banner{position:relative;background:var(--pink);padding:36px 36px 40px;border:1px solid #2223;border-radius:4px;overflow:hidden}.result-banner h1{font:italic clamp(40px,7vw,69px)/1.05 Georgia;margin:32px 0 8px;position:relative;letter-spacing:-2px}.result-banner .sub{font:normal 24px Georgia;margin:0}.seal{position:absolute;right:-12px;top:-18px;width:135px;height:135px;opacity:.2;transform:rotate(20deg)}.result-copy{font-size:16px;line-height:1.8;padding:12px 5px}.result-copy p{margin:22px 0}.result-actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:25px 0}.textbtn{border:0;border-bottom:1px solid var(--ink);background:none;padding:8px 0;font-size:13px}.love{font:italic 20px/1.5 Georgia;margin-top:30px}.enter{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}[hidden]{display:none!important}@media(max-width:680px){header{padding:18px 6%}.brand{gap:8px}.brand strong{font-size:28px}.issue{font-size:9px;letter-spacing:1px}main{padding-top:25px}.hero{display:flex;flex-direction:column;gap:10px;min-height:0;align-items:stretch}.hero h1{font-size:55px;letter-spacing:-2px;margin:18px 0}.intro{font-size:14px;margin-bottom:10px;max-width:100%}.start{width:100%;margin-top:12px}.art{min-height:260px;margin:10px 0 18px}.card{width:170px;height:220px;padding:16px}.card b{font-size:25px}.symbol{width:115px;height:115px}.art-note{bottom:2px;right:8px;font-size:13px}.question-num{margin-top:26px}.quiz h2{font-size:30px}.answer{font-size:14px;padding:16px 14px;gap:12px}.question-foot{align-items:stretch;flex-direction:column;gap:6px}.question-foot .hint{order:2;max-width:none;text-align:center}.question-foot .primary{width:100%;margin-top:6px}.result-banner{padding:28px 24px 30px}.result-banner h1{font-size:clamp(34px,9.5vw,58px);letter-spacing:-1.4px}.result-copy{font-size:15px}.result-actions .primary{width:100%}footer{font-size:10px}.quiz{margin-top:0}.love{font-size:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Every state occupies the available viewport; no page scrolling. */
html{height:100%;overflow:hidden}body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none}header{width:100%;flex:none;padding:14px 5%;height:65px}footer{width:100%;flex:none;padding:10px 5%;height:34px}main{width:100%;flex:1;min-height:0;max-width:1150px;padding:0 5%;position:relative;overflow:hidden}main>section{position:absolute;left:50%;top:50%;margin:0;transform-origin:center;animation:none;will-change:auto}.hero{min-height:0;gap:30px}.hero h1{font-size:clamp(45px,5.8vw,74px);margin:20px 0}.art{min-height:360px}.quiz{padding:10px 0}.progress-top{margin-bottom:10px}.question-num{margin:22px 0 12px}.quiz h2{font-size:clamp(27px,3.4vw,38px);margin-bottom:20px}.answers{gap:10px}.answer{padding:16px 18px}.question-foot{margin-top:18px}.result{padding:10px 0}.result-banner{padding:22px 28px}.result-banner h1{margin:18px 0 6px;font-size:clamp(37px,5.5vw,57px)}.result-banner .sub{font-size:20px}.result-copy{font-size:15px;line-height:1.55;padding:0 3px}.result-copy p{margin:15px 0}.result-actions{margin:15px 0;gap:18px}.result-actions .primary{min-height:46px;padding:12px 20px}.love{margin:16px 0 0;font-size:17px;line-height:1.35}#notice{margin:6px 0 0;min-height:13px;font-size:11px}.primary:not(:disabled):hover{transform:none}.enter{animation:none}
@media(max-width:680px){header{height:54px;padding:10px 5%}.brand strong{font-size:25px}.brand>span{font-size:9px;letter-spacing:1px}.issue{font-size:8px}footer{height:30px;font-size:9px;padding:8px 5%}.hero{display:block}.hero h1{font-size:clamp(40px,11vw,54px);margin:16px 0;line-height:1}.hero h1 br:nth-of-type(2){display:none}.intro{font-size:13px;line-height:1.5;margin:10px 0}.hero .eyebrow{font-size:9px;letter-spacing:1.4px}.start{padding:14px 20px;min-height:49px;margin-top:8px}.meta{font-size:10px;margin-top:10px}.art{min-height:155px;margin:13px 0 0}.card{width:120px;height:147px;padding:11px}.card small{font-size:6px;letter-spacing:1px}.card b{font-size:18px}.symbol{height:72px;width:72px}.art-note{font-size:11px;bottom:8px;right:0}.quiz{padding:10px 0}.question-num{margin:18px 0 10px;font-size:14px}.quiz h2{font-size:27px;line-height:1.14;margin-bottom:17px}.answer{font-size:14px;padding:14px 12px;line-height:1.4;gap:11px}.letter{width:27px;height:27px}.question-foot{margin-top:12px;gap:2px}.question-foot .primary{min-height:48px;padding:12px 20px}.hint{font-size:12px;margin:9px 0 0}.result-banner{padding:17px 20px}.result-banner h1{font-size:clamp(34px,9.4vw,47px);margin:17px 0 4px}.result-banner .eyebrow{font-size:8px}.result-banner .sub{font-size:19px}.seal{width:95px;height:95px}.result-copy{font-size:14px;line-height:1.48}.result-copy p{margin:12px 0}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:13px 0}.result-actions .primary{font-size:12px;min-height:43px;padding:10px 12px;gap:8px}.textbtn{font-size:11px;justify-self:center}.love{font-size:16px;margin:13px 0 0}.result{padding:8px 0}}
@media(max-height:650px) and (max-width:680px){.art{min-height:110px}.card{width:96px;height:115px;padding:8px}.card b{font-size:15px}.symbol{height:49px;width:49px}.hero h1{font-size:39px;margin:12px 0}.hero .intro{font-size:12px}.quiz h2{font-size:24px}.question-num{margin-top:12px}.answer{padding:11px 12px}.result-copy{font-size:13px;line-height:1.4}.result-copy p{margin:10px 0}.result-banner h1{font-size:35px}.result-banner{padding:13px 18px}}
</style></head><body><header><div class="brand"><strong>113</strong><span>дней рождения</span></div><div class="issue">Личное исследование<br>прекрасного человека</div></header><main id="app"></main><footer><span>Для Анечки, с любовью ♥</span><span>Хороша в любом результате.</span></footer>
<script>
const questions=[
['Ты проснулась, и выяснилось, что сегодня можно делать всё что угодно. Твой план?',['Найти приключение. Подробности выяснить по дороге.','Красиво собраться и выйти туда, где меня хорошо видно.','Остаться в кровати, пока не появится предложение лучше.'],[0,1,2]],
['Какой завтрак соответствует твоему сегодняшнему настроению?',['Икра, игристое, красивая сорочка. Утро должно соответствовать.','Кофе и круассан с грецким орехом, которые кто-то уже принес.','Завтрак, который незаметно превратился в обед, потому что мы заболтались.'],[1,2,0]],
['Тебе предлагают пойти в кино. Что уточнишь первым делом?',['А попкорн будет огромный?','Там будет что потом обсудить с подругой до неприличных подробностей?','Насколько удобно я там устроюсь и кто всё организует?'],[1,0,2]],
['Ты собираешься выходить. Что происходит перед зеркалом?',['Укладка, красивое белье, подходящий наряд. Я получаю удовольствие уже сейчас.','Смотрю на себя и думаю: кому бы отправить фотографию, чтобы у человека изменились планы?','Я уже прекрасна. Осталось решить, заслуживает ли мероприятие моего присутствия.'],[1,0,2]],
['Вечером хочется чего-нибудь приятного. Чего именно?',['Чтобы всё случилось само: еда появилась, дела закончились, меня никто не торопил.','Нарядиться и провести вечер с ощущением, что мне очень идет эта жизнь.','Танцевать, смеяться и по возможности забыть, что завтра существует.'],[2,1,0]],
['Подруга прислала сообщение: «Мне надо тебе кое-что рассказать». Твоя реакция?',['Устраиваюсь поудобнее. Надеюсь, там полноценная глава с подробностями.','Прошу начать с самого неприличного. Хронологию восстановим потом.','Предлагаю встретиться и красиво поесть. Таким историям нужна обстановка.'],[2,0,1]],
['Какое обращение тебе сегодня особенно подходит?',['«С тобой невозможно вести себя прилично».','«Госпожа, всё готово. Вам остается только отдыхать».','«Можно я посвящу тебе стихотворение?»'],[0,2,1]],
['Что сегодня считается достаточным основанием для опоздания?',['Не смогла выйти, пока не добилась нужного эффекта от укладки.','Слишком хорошо проводила время. Прошу понять и порадоваться.','Я предупреждала, что буду. Точное время — уже дополнительная информация.'],[1,0,2]]];
const results=[{name:'Игривая',color:'#eab2bd',text:[
'Сегодня у тебя настроение, из-за которого обычный разговор может внезапно стать очень интересным. Хочется флиртовать, танцевать, смеяться и смотреть, что будет, если немножко подразнить мир.',
'Рекомендуется дать себе такую возможность. Отправить сообщение, которое давно крутится в голове, выбрать наряд с неоднозначными намерениями или легко крутя бёдрами прогуляться в кофейню.',
'Если завтра придется писать объяснительную — хотя бы будет о чем.']},
{name:'Великолепная',color:'#dbe18a',text:[
'Сегодня тебе хочется нравиться себе во всех подробностях. Чтобы волосы лежали как надо, белье было красивым, еду подавали на нормальной тарелке, а вечер заслуживал твоих сборов.',
'Можно потратить время на укладку. Можно надеть лучшее просто на ужин. Можно попросить сфотографировать тебя еще раз, потому что на предыдущем кадре мир не справился с задачей.',
'Ты сегодня великолепная. Хорошо бы выйти и дать людям шанс это заметить.']},
{name:'Невероятная',color:'#c9cce6',text:[
'Сегодня ты особенно ценишь магию, при которой сидишь и ничего не делаешь, а хорошее происходит. Кто-то приносит кофе, решает вопросы, выбирает удобное время и говорит: «Госпожа, мы обо всем позаботились».',
'Прими обслуживание. Устраивайся поудобнее, ешь вкусное, слушай истории и выдавай свои бесценные комментарии. Заодно можно отменить что-нибудь необязательное.',
'Любовь к тебе сегодня вполне может выразиться в том, что тебе просто принесут бокал игристого и поцелуют в коленочку.']}];
const app=document.getElementById('app');let step=0,answers=Array(8).fill(null);
const star='<svg viewBox="0 0 160 160" fill="none" aria-hidden="true"><path d="M80 8C86 59 101 74 152 80C101 86 86 101 80 152C74 101 59 86 8 80C59 74 74 59 80 8Z" fill="currentColor"/><circle cx="80" cy="80" r="48" stroke="currentColor"/></svg>';
function fitScreen(){const section=app.firstElementChild;if(!section)return;const width=Math.max(1,app.clientWidth*.9);section.style.width=Math.min(width,section.classList.contains('hero')?1040:730)+'px';section.style.transform='translate(-50%,-50%)';const scale=Math.min(1,Math.max(1,app.clientHeight-16)/section.scrollHeight);section.style.transform='translate(-50%,-50%) scale('+scale+')';}
window.addEventListener('resize',fitScreen);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitScreen);
function present(html){app.innerHTML=html;fitScreen();const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
function home(){present(`<section class="hero enter"><div><div class="eyebrow"><span class="dot"></span> Тест на сегодняшнее настроение</div><h1>Какая ты<br>сегодня,<br><em>Анечка</em><br>Аббасова?</h1><p class="intro">Восемь вопросов, чтобы понять, с какой Анечкой мы сегодня имеем дело.</p><button class="primary start" id="start">Узнать себя <span>↗</span></button><p class="meta">8 вопросов · около 2 минут · только прекрасные итоги</p></div><div class="art" aria-hidden="true"><div class="card back"><small>Исключительный экземпляр</small><b>Великолепная.</b></div><div class="card front"><small>В любом настроении</small><div class="symbol">${star}</div><b>Такая одна.</b></div><div class="art-note">Все совпадения — про тебя.</div></div></section>`);document.getElementById('start').onclick=()=>{step=0;quiz()};}
function quiz(){const q=questions[step];present(`<section class="quiz enter"><div class="progress-top"><button class="backbtn" id="back">← ${step?'Назад':'К началу'}</button><span class="eyebrow">${step+1} / 08</span></div><div class="bars" aria-label="Вопрос ${step+1} из 8">${questions.map((_,i)=>`<i class="${i<=step?'filled':''}"></i>`).join('')}</div><p class="question-num">Вопрос ${String(step+1).padStart(2,'0')}</p><h2 id="question">${q[0]}</h2><div class="answers" role="group" aria-labelledby="question">${q[1].map((a,i)=>`<button class="answer" role="radio" aria-checked="${answers[step]===i}" data-choice="${i}"><span class="letter">${'АБВ'[i]}</span><span>${a}</span></button>`).join('')}</div><div class="question-foot"><p class="hint">Если подходит всё — выбирай то, что ближе прямо сейчас.</p><button class="primary" id="next" ${answers[step]===null?'disabled':''}>${step===7?'Мой результат':'Дальше'} <span>→</span></button></div></section>`);const group=app.querySelector('.answers');group.setAttribute('role','radiogroup');function select(i){answers[step]=i;app.querySelectorAll('.answer').forEach((b,j)=>b.setAttribute('aria-checked',j===i));document.getElementById('next').disabled=false;}app.querySelectorAll('.answer').forEach((b,i)=>{b.onclick=()=>select(i);b.onkeydown=e=>{let n;if(['ArrowDown','ArrowRight'].includes(e.key))n=(i+1)%3;if(['ArrowUp','ArrowLeft'].includes(e.key))n=(i+2)%3;if(n!==undefined){e.preventDefault();select(n);app.querySelectorAll('.answer')[n].focus();}}});document.getElementById('back').onclick=()=>{if(step){step--;quiz()}else home()};document.getElementById('next').onclick=()=>{if(answers[step]===null)return;if(step<7){step++;quiz()}else showResult()};}
function winner(a){const votes=a.map((v,i)=>questions[i][2][v]);const scores=[0,0,0];votes.forEach(v=>scores[v]++);const max=Math.max(...scores);return votes.slice().reverse().find(v=>scores[v]===max);}
function showResult(){const r=results[winner(answers)];present(`<section class="result enter"><div class="result-banner" style="background:${r.color}"><div class="eyebrow">Исследование завершено · 08 / 08</div><div class="seal">${star}</div><h1>${r.name}</h1><p class="sub">Анечка Аббасова.</p></div><div class="result-copy">${r.text.map(p=>`<p>${p}</p>`).join('')}</div><div class="result-actions"><button class="primary" id="again">А если еще раз? <span>↻</span></button><button class="textbtn" id="copy">Скопировать результат</button></div><p class="love">С днем рождения, моя любимая.<br>Ты прекрасна во всех своих состояниях. ♥</p><p id="notice" role="status" class="meta"></p></section>`);document.getElementById('again').onclick=()=>{answers=Array(8).fill(null);step=0;quiz()};document.getElementById('copy').onclick=async()=>{const text=`Сегодня я — ${r.name.toLowerCase()} Анечка Аббасова.\n\n`+r.text.join('\n\n');try{await navigator.clipboard.writeText(text);document.getElementById('notice').textContent='Результат скопирован ♥';}catch{const area=document.createElement('textarea');area.value=text;area.style.cssText='width:100%;min-height:200px;margin-top:15px';area.setAttribute('aria-label','Результат для копирования');document.getElementById('notice').replaceChildren(area);fitScreen();area.focus({preventScroll:true});area.select();}};}
home();
</script></body></html>
